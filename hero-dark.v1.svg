<title id="t">Mike Manko, Warsaw, Poland</title>
<desc id="d">Animated terminal. A command draws a 5 by 5 pixel letter M in large blocks, the headline is printed beside it, and the screen stops on a prompt with a blinking cursor. A status bar lists: raft, edge, ddd, tenants, agents, p99, webgl. Usually building something, unless I'm out on the water.</desc>
